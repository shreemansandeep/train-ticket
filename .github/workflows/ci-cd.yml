name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 1: Maven Compile (using Maven container)
      - name: Maven Compile
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app maven:3.9.11-eclipse-temurin-17 mvn clean compile

      # Step 2: Maven Test (using Maven container)
      - name: Maven Test
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app maven:3.9.11-eclipse-temurin-17 mvn test

      # Step 3: Build WAR Package (using Maven container)
      - name: Build WAR Package
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app maven:3.9.11-eclipse-temurin-17 mvn clean package

      # Step 4 & 5: Docker Login, Build & Push
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/trainticketsystem:${{ github.sha }} .

      - name: Docker Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/trainticketsystem:${{ github.sha }}


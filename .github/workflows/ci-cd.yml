name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: self-hosted

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Verify Maven Version
        run: mvn -version

      - name: Maven Compile
        run: mvn clean compile

      - name: Maven Test
        run: mvn test

      - name: Maven Build
        run: mvn clean package
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean stale root-owned build artifacts
        run: |
          docker run --rm -v ${{ github.workspace }}:/app alpine rm -rf /app/target /app/.scannerwork || true


      # Step 1: Maven Compile (using Maven container)
      - name: Maven Compile
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app maven:3.9.11-eclipse-temurin-17 mvn clean compile

      # Step 2: Maven Test (using Maven container)
      - name: Maven Test
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app maven:3.9.11-eclipse-temurin-17 mvn test

      # Step 3: Build WAR Package (using Maven container)
      - name: Build WAR Package
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app maven:3.9.11-eclipse-temurin-17 mvn clean package

      # Step 4: SonarQube Scan
      - name: SonarQube Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app -w /app \
            maven:3.9.11-eclipse-temurin-17 \
            mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=trainticketsystem \
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}



      - name: Set Short Commit SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      # Step 5 & 6: Docker Login, Build & Push
      # - name: Log in to Docker Hub
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # - name: Docker Build Image
      #   run: |
      #     docker build -t ${{ secrets.DOCKER_USERNAME }}/trainticketsystem:${{ env.SHORT_SHA }} .

      # - name: Docker Push Image
      #   run: |
      #     docker push ${{ secrets.DOCKER_USERNAME }}/trainticketsystem:${{ env.SHORT_SHA }}

      # - name: Clean up Docker Image from Runner
      #   if: always()
      #   run: |
      #     docker rmi ${{ secrets.DOCKER_USERNAME }}/trainticketsystem:${{ env.SHORT_SHA }} || true

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}    

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # Build Docker Image
      - name: Docker Build Image
        run: |
          docker build -t trainticketsystem:${{ env.SHORT_SHA }} .

      # Trivy Image Scan
      - name: Trivy Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/ \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            trainticketsystem:${{ env.SHORT_SHA }}          

      # Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag trainticketsystem:${{ env.SHORT_SHA }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/trainticketsystem:${{ env.SHORT_SHA }}

      # Push Docker Image to Amazon ECR
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/trainticketsystem:${{ env.SHORT_SHA }}

      # Cleanup Local Images
      - name: Remove Local Docker Images
        if: always()
        run: |
          docker rmi trainticketsystem:${{ env.SHORT_SHA }} || true

          docker rmi ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/trainticketsystem:${{ env.SHORT_SHA }} || true            

      - name: Clean up workspace permissions & build artifacts
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/app alpine rm -rf /app/target /app/.scannerwork || true



